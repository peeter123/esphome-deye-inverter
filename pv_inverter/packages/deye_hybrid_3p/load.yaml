globals:
  - id: battery_power_updated
    type: uint32_t
    initial_value: "0"
  - id: grid_power_updated
    type: uint32_t
    initial_value: "0"
  - id: load_power_updated
    type: uint32_t
    initial_value: "0"
  - id: generator_power_updated
    type: uint32_t
    initial_value: "0"
  - id: generator_port_mode_updated
    type: uint32_t
    initial_value: "0"
  - id: pv_power_updated
    type: uint32_t
    initial_value: "0"
  - id: last_valid_power_losses
    type: uint32_t
    initial_value: "0"
  - id: power_losses_barrier
    type: uint32_t
    initial_value: "0"
  - id: power_losses_sample_1
    type: float
    initial_value: "0"
  - id: power_losses_sample_2
    type: float
    initial_value: "0"
  - id: power_losses_sample_3
    type: float
    initial_value: "0"
  - id: power_losses_sample_index
    type: uint8_t
    initial_value: "0"
  - id: power_losses_sample_count
    type: uint8_t
    initial_value: "0"
  - id: power_losses_stale
    type: bool
    initial_value: "true"
  - id: losses_reconciliation_requested
    type: uint32_t
    initial_value: "0"
  - id: daily_battery_charge_updated
    type: uint32_t
    initial_value: "0"
  - id: daily_battery_discharge_updated
    type: uint32_t
    initial_value: "0"
  - id: daily_energy_bought_updated
    type: uint32_t
    initial_value: "0"
  - id: daily_energy_sold_updated
    type: uint32_t
    initial_value: "0"
  - id: daily_load_consumption_updated
    type: uint32_t
    initial_value: "0"
  - id: daily_pv_production_updated
    type: uint32_t
    initial_value: "0"
  - id: daily_generator_production_updated
    type: uint32_t
    initial_value: "0"
  - id: total_losses_seeded
    type: bool
    restore_value: true
    initial_value: "false"
  - id: daily_losses_day
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: pending_daily_losses_day
    type: uint32_t
    initial_value: "0"
  - id: daily_losses_refresh_requested
    type: uint32_t
    initial_value: "0"


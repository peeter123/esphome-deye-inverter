  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Load UPS L2 Power"
    register_type: holding
    address: 641
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:home-lightning-bolt"
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Load UPS L3 Power"
    register_type: holding
    address: 642
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:home-lightning-bolt"
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Load UPS Power"
    register_type: holding
    address: 643
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 0
    value_type: S_WORD
    icon: "mdi:home-lightning-bolt"
    disabled_by_default: true

  - platform: template
    name: "Power Losses"
    id: power_losses
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      const uint32_t now = millis();
      const uint32_t max_age = 15000;
      const float values[] = {
        id(pv1_power).state,
        id(pv2_power).state,
        id(pv3_power).state,
        id(pv4_power).state,
        id(battery_power).state,
        id(grid_power).state,
        id(generator_power_total).state,
        id(load_power).state,
      };
      const uint32_t updated[] = {
        id(pv_power_updated),
        id(battery_power_updated),
        id(grid_power_updated),
        id(generator_power_updated),
        id(load_power_updated),
        id(generator_port_mode_updated),
      };
      for (float value : values) {
        if (std::isnan(value)) {
          return 0.0f;
        }
      }
      for (uint32_t timestamp : updated) {
        if (
          timestamp == 0 ||
          now - timestamp > max_age ||
          static_cast<int32_t>(timestamp - id(power_losses_barrier)) <= 0
        ) {
          return 0.0f;
        }
      }

      const bool smart_load =
        id(generator_port_use).current_option() == "SmartLoad Output";
      const float generator = smart_load
        ? -id(generator_power_total).state
        : id(generator_power_total).state;
      const float balance =
        id(pv1_power).state +
        id(pv2_power).state +
        id(pv3_power).state +
        id(pv4_power).state +
        id(battery_power).state +
        id(grid_power).state +
        generator -
        id(load_power).state;
      const float sample = std::max(0.0f, balance);
      if (id(power_losses_sample_index) == 0) {
        id(power_losses_sample_1) = sample;
      } else if (id(power_losses_sample_index) == 1) {
        id(power_losses_sample_2) = sample;
      } else {
        id(power_losses_sample_3) = sample;
      }
      id(power_losses_sample_index) = (id(power_losses_sample_index) + 1) % 3;
      if (id(power_losses_sample_count) < 3) {
        id(power_losses_sample_count)++;
      }

      float filtered = sample;
      if (id(power_losses_sample_count) == 3) {
        const float low = std::min(
          id(power_losses_sample_1),
          id(power_losses_sample_2)
        );
        const float high = std::max(
          id(power_losses_sample_1),
          id(power_losses_sample_2)
        );
        filtered = std::max(
          low,
          std::min(high, id(power_losses_sample_3))
        );
      }
      id(power_losses_barrier) = now;
      id(last_valid_power_losses) = now;
      id(power_losses_stale) = false;
      return filtered;
    icon: "mdi:home-lightning-bolt"

  - platform: integration
    name: "Daily Losses"
    id: daily_losses
    sensor: power_losses
    time_unit: h
    integration_method: right
    restore: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.001
    icon: "mdi:home-lightning-bolt"

  - platform: integration
    name: "Total Losses"
    id: total_losses
    sensor: power_losses
    time_unit: h
    integration_method: right
    restore: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.001
    icon: "mdi:home-lightning-bolt"

interval:
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(last_valid_power_losses) == 0 || now - id(last_valid_power_losses) > 10000) {
            if (!id(power_losses_stale) || id(losses_reconciliation_requested) == 0) {
              id(losses_reconciliation_requested) = now;
            }
            id(power_losses_stale) = true;
            id(power_losses_sample_count) = 0;
            id(power_losses_sample_index) = 0;
            id(power_losses).publish_state(0.0f);
          }

          const auto inverter_time = id(esptime).now();
          if (inverter_time.is_valid()) {
            const uint32_t today =
              static_cast<uint32_t>(inverter_time.year) * 512U +
              static_cast<uint32_t>(inverter_time.day_of_year);
            if (id(daily_losses_day) != today) {
              if (id(pending_daily_losses_day) != today) {
                id(pending_daily_losses_day) = today;
                id(daily_losses_refresh_requested) = now;
              } else {
                const uint32_t requested = id(daily_losses_refresh_requested);
                const uint32_t refreshed[] = {
                  id(daily_battery_charge_updated),
                  id(daily_battery_discharge_updated),
                  id(daily_energy_bought_updated),
                  id(daily_energy_sold_updated),
                  id(daily_load_consumption_updated),
                  id(daily_pv_production_updated),
                  id(daily_generator_production_updated),
                  id(generator_port_mode_updated),
                };
                bool ready = requested != 0;
                for (uint32_t timestamp : refreshed) {
                  ready &= timestamp != 0 &&
                    static_cast<int32_t>(timestamp - requested) > 0;
                }
                const float values[] = {
                  id(daily_energy_bought).state,
                  id(daily_pv_production).state,
                  id(daily_generator_production).state,
                  id(daily_battery_discharge).state,
                  id(daily_energy_sold).state,
                  id(daily_battery_charge).state,
                  id(daily_load_consumption).state,
                };
                for (float value : values) {
                  ready &= !std::isnan(value);
                }
                if (ready) {
                  // GEN history cannot be signed after a port mode change.
                  const float seed_kwh =
                    values[0] + values[1] + values[3] -
                    values[4] - values[5] - values[6];
                  id(daily_losses).set_value(std::max(0.0f, seed_kwh) * 1000.0f);
                  id(daily_losses_day) = today;
                  id(pending_daily_losses_day) = 0;
                  ESP_LOGI("losses", "Seeded daily losses at %.1f kWh",
                    std::max(0.0f, seed_kwh));
                }
              }
            }
          }

          const uint32_t reconcile_requested = id(losses_reconciliation_requested);
          if (reconcile_requested != 0) {
            const uint32_t refreshed[] = {
              id(daily_battery_charge_updated),
              id(daily_battery_discharge_updated),
              id(daily_energy_bought_updated),
              id(daily_energy_sold_updated),
              id(daily_load_consumption_updated),
              id(daily_pv_production_updated),
              id(daily_generator_production_updated),
              id(generator_port_mode_updated),
            };
            bool ready = true;
            for (uint32_t timestamp : refreshed) {
              ready &= timestamp != 0 &&
                static_cast<int32_t>(timestamp - reconcile_requested) > 0;
            }
            const float daily_values[] = {
              id(daily_energy_bought).state,
              id(daily_pv_production).state,
              id(daily_generator_production).state,
              id(daily_battery_discharge).state,
              id(daily_energy_sold).state,
              id(daily_battery_charge).state,
              id(daily_load_consumption).state,
            };
            const float total_values[] = {
              id(total_energy_bought).state,
              id(total_pv_production).state,
              id(total_generator_production).state,
              id(total_battery_discharge).state,
              id(total_energy_sold).state,
              id(total_battery_charge).state,
              id(total_consumption).state,
            };
            for (float value : daily_values) {
              ready &= !std::isnan(value);
            }
            for (float value : total_values) {
              ready &= !std::isnan(value);
            }
            if (ready) {
              const float daily_counter_kwh = std::max(
                0.0f,
                daily_values[0] + daily_values[1] + daily_values[3] -
                daily_values[4] - daily_values[5] -
                daily_values[6]
              );
              if (
                inverter_time.is_valid() &&
                id(daily_losses_day) ==
                  static_cast<uint32_t>(inverter_time.year) * 512U +
                  static_cast<uint32_t>(inverter_time.day_of_year) &&
                !std::isnan(id(daily_losses).state) &&
                daily_counter_kwh > id(daily_losses).state
              ) {
                id(daily_losses).set_value(daily_counter_kwh * 1000.0f);
              }

              const float total_counter_kwh = std::max(
                0.0f,
                total_values[0] + total_values[1] + total_values[3] -
                total_values[4] - total_values[5] -
                total_values[6]
              );
              if (
                id(total_losses_seeded) &&
                !std::isnan(id(total_losses).state) &&
                total_counter_kwh > id(total_losses).state
              ) {
                id(total_losses).set_value(total_counter_kwh * 1000.0f);
              }
              id(losses_reconciliation_requested) = 0;
            }
          }

          if (!id(total_losses_seeded)) {
            const float values[] = {
              id(total_energy_bought).state,
              id(total_pv_production).state,
              id(total_generator_production).state,
              id(total_battery_discharge).state,
              id(total_energy_sold).state,
              id(total_battery_charge).state,
              id(total_consumption).state,
            };
            bool ready = id(generator_port_mode_updated) != 0;
            for (float value : values) {
              ready &= !std::isnan(value);
            }
            if (ready) {
              const float seed_kwh =
                values[0] + values[1] + values[3] -
                values[4] - values[5] - values[6];
              id(total_losses).set_value(std::max(0.0f, seed_kwh) * 1000.0f);
              id(total_losses_seeded) = true;
              if (seed_kwh < 0.0f) {
                ESP_LOGW("losses",
                  "Lifetime counter balance is %.1f kWh; seeded total losses at 0",
                  seed_kwh);
              } else {
                ESP_LOGI("losses", "Seeded total losses at %.1f kWh", seed_kwh);
              }
            }
          }

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "AC Load Relay Reserved"
    register_type: holding
    address: 552
    bitmask: 0x2
    icon: "mdi:toggle-switch-variant"
